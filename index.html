<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pescados Caparaó - Catálogo Digital</title>
  <link rel="icon" type="image/png" href="imgs/download.png">
  <meta property="og:title" content="Pescados Caparaó - Catálogo Digital">
  <meta property="og:description" content="Peixaria e Frutos do Mar - Alegre/ES. Qualidade e frescor direto para a sua mesa!">
  <meta property="og:image" content="https://pescadoscaparao.vercel.app/imgs/pescadoscaparao.jpg">
  <meta property="og:url" content="https://pescadoscaparao.vercel.app/">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="main-header">
    <div class="header-container">
      <div class="brand-info">
        <button class="menu-toggle-btn" id="menu-toggle-btn" onclick="toggleMobileMenu(event)" aria-label="Abrir menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="logo-wrapper">
          <img src="imgs/pescadoscaparao.jpg" alt="Pescados Caparaó Logo" class="brand-logo">
        </div>
        <div class="brand-title">
          <h1>PESCADOS CAPARAÓ</h1>
          <span>PEIXARIA</span>
        </div>
      </div>

      <!-- GRUPO DO LADO DIREITO (NAVEGAÇÃO + CARRINHO) -->
      <div class="header-right-actions">
        <nav class="main-nav" id="main-nav">
          <button class="nav-btn active" onclick="showSection('catalogo')">Catálogo</button>
          <button class="nav-btn" onclick="showSection('receitas')">Receitas</button>
          <button class="nav-btn" onclick="openAboutModal()">Informações</button>
          <button class="nav-btn" id="client-auth-btn" onclick="openAuthModal()">Entrar / Cadastrar</button>
        </nav>

        <button class="cart-toggle-btn" onclick="toggleCart()">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="cart-badge" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- BARRA DE AÇÕES DO ADMINISTRADOR -->
    <div id="admin-bar" class="admin-bar" style="display: none;">
      <div class="admin-status"></div>
      <div class="admin-actions">
        <button class="btn-add-product" onclick="openProductModal()">Adicionar Produto</button>
        <button class="btn-add-product" onclick="openRecipeModal()">Adicionar Receita</button>
        <button class="btn-add-product" onclick="openCategoryModal()">Adicionar Categorias</button>
        <button class="btn-logout" onclick="adminLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>

    <!-- INÍCIO DOS COMPONENTES -->
    <div id="component-catalogo"></div>
    <div id="component-receitas"></div>
    <div id="component-informacoes"></div>

  </main>

  <footer class="main-footer">
    <div class="footer-container">
      <p>&copy; 2026 Pescados Caparaó. Todos os direitos reservados.</p>
      <div class="footer-links">
        <a href="https://wa.me/5528999868639" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
        <a href="https://www.instagram.com/pescadoscaparao/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i> Instagram</a>
        <p><a href="https://www.google.com/maps/search/?api=1&query=Pescados+Capara%C3%B3,+Av.+Ol%C3%ADvio+Corr%C3%AAia+Pedrosa,+130+-+Centro,+Alegre+-+ES,+29500-000" target="_blank" rel="noopener noreferrer" class="contact-link">Pescados Caparaó, Alegre - ES</a></p>
      </div>
    </div>
  </footer>

  <!-- PAINEL LATERAL DO CARRINHO -->
  <div class="cart-sidebar" id="cart-sidebar" style="z-index: 9999;">
    <div class="cart-header">
      <h2><i class="fa-solid fa-basket-shopping"></i> Seu Pedido</h2>
      <button class="close-cart-btn" onclick="toggleCart()">&times;</button>
    </div>
    
    <div class="cart-items" id="cart-items"></div>

    <div class="cart-footer">
      <div class="cart-total">
        <span>Total Produtos:</span>
        <strong id="cart-total-price">R$ 0,00</strong>
      </div>
      <button class="btn-whatsapp" onclick="openDeliveryModal()">
        <i class="fa-solid fa-truck-fast"></i> Finalizar Pedido
      </button>
    </div>
  </div>
  <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>

  <!-- COMPONENTE DE MODAIS -->
  <div id="component-modais"></div>

  <!-- SCRIPT CARREGADOR DE COMPONENTES E CONEXÃO -->
  <script>
    async function loadComponents() {
      const components = [
        { id: 'component-catalogo', url: 'components/catalogo.html' },
        { id: 'component-receitas', url: 'components/receitas.html' },
        { id: 'component-informacoes', url: 'components/informacoes.html' },
        { id: 'component-modais', url: 'components/modais.html' }
      ];

      // Busca e insere o HTML de todos os componentes
      for (const comp of components) {
        try {
          const response = await fetch(comp.url);
          if (response.ok) {
            document.getElementById(comp.id).innerHTML = await response.text();
          } else {
            console.error(`Falha ao carregar ${comp.url}: Status ${response.status}`);
          }
        } catch (error) {
          console.error(`Erro de rede ao buscar ${comp.url}:`, error);
        }
      }

      // Após injetar todo o HTML dos componentes, carrega o entrypoint principal dentro da pasta js/[cite: 11]
      const mainScript = document.createElement('script');
      mainScript.type = 'module';
      mainScript.src = 'js/main.js';
      document.body.appendChild(mainScript);
    }

    document.addEventListener("DOMContentLoaded", loadComponents);
  </script>
</body>
</html>
